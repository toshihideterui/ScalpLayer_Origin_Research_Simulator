<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScalpLayer Origin Stability Engine v1.0</title><style>:root{--bg:#080b12;--p:#111522;--g:#d4af37;--t:#f8fafc;--m:#aab4c3}*{box-sizing:border-box}body{margin:0;padding:18px;background:linear-gradient(#151a28,#080b12 45%);color:var(--t);font-family:system-ui,sans-serif}.w{max-width:1550px;margin:auto}.hero{text-align:center}.card{background:var(--p);border:1px solid rgba(212,175,55,.3);border-radius:14px;padding:18px;margin:16px 0}h1{font-size:30px}h2{color:#ffe47b}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}label{display:block;color:var(--m);font-weight:800;margin:6px 0}input,select,textarea,button{width:100%;min-height:44px;border-radius:9px;border:1px solid rgba(212,175,55,.4);background:#06080d;color:var(--t);padding:9px}textarea{min-height:85px}button{background:linear-gradient(135deg,var(--g),#98751b);color:#111827;font-weight:900;border:0;cursor:pointer}.secondary{background:#263244;color:white}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.stat{background:#070a10;border:1px solid rgba(212,175,55,.22);border-radius:11px;padding:12px}.stat span{display:block;color:var(--m);font-size:12px}.stat strong{font-size:20px}.prog{height:12px;background:#293142;border-radius:999px;overflow:hidden}.prog i{display:block;width:0;height:100%;background:linear-gradient(90deg,#d4af37,#38bdf8,#22c55e)}.table{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:8px;border-bottom:1px solid #293142;font-size:12px;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#070a10}.heat{display:grid;grid-template-columns:repeat(12,minmax(80px,1fr));gap:6px}.cell{background:#070a10;border:1px solid #293142;border-radius:8px;padding:10px}.cell b{display:block;font-size:17px}.log{height:170px;overflow:auto;background:#030509;border-radius:9px;padding:10px;font:12px ui-monospace,monospace;white-space:pre-wrap}.small{color:var(--m);font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.heat{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="w"><section class="hero"><h1>ScalpLayer Origin Stability Engine v1.0</h1><p class="small">Feature Miningで発見したルールを、年・月・曜日・時間へ分解して再現性を検証</p></section>
<section class="card"><h2>1. 入力</h2><label>CoreFeatures CSV</label><input id="core" type="file" accept=".csv"><div class="row"><div><label>Feature Mining Summary JSON</label><input id="sum" type="file" accept=".json"></div><div><label>Core Manifest JSON</label><input id="man" type="file" accept=".json"></div></div><div id="info" class="small">未選択</div></section>
<section class="card"><h2>2. ルールとExit</h2><div class="row"><div><label>Rule</label><textarea id="rule">ATR=VeryHigh & Session=Off & Weekday=Fri & Hour=7</textarea></div><div><label>Direction</label><select id="dir"><option>SHORT</option><option>LONG</option></select></div><div><label>TP</label><input id="tp" type="number" value="3" step="0.1"></div><div><label>SL</label><input id="sl" type="number" value="20" step="0.1"></div><div><label>Hold</label><input id="hold" type="number" value="5"></div></div><div class="row"><div><label>最低Trades/期間</label><input id="minT" type="number" value="20"></div><div><label>安定判定PF</label><input id="minPF" type="number" value="1" step="0.05"></div><div><label>安定判定Avg</label><input id="minAvg" type="number" value="0" step="0.05"></div></div><button id="run">Stability分析を開始</button><button id="cancel" class="secondary" disabled>中止</button><div id="status" class="small">ファイルを選択してください。</div><div class="prog"><i id="bar"></i></div></section>
<section class="card"><h2>3. Validation</h2><div id="val" class="grid"></div></section><section class="card"><h2>4. Stability Score</h2><div id="score" class="grid"></div></section><section class="card"><h2>5. 年別</h2><div id="years" class="table">未実行</div></section><section class="card"><h2>6. 月別</h2><div id="months" class="heat">未実行</div></section><section class="card"><h2>7. 曜日別</h2><div id="week" class="table">未実行</div></section><section class="card"><h2>8. 時間帯別</h2><div id="hours" class="table">未実行</div></section><section class="card"><h2>9. 年×曜日</h2><div id="yw" class="table">未実行</div></section><section class="card"><h2>10. 年×時間</h2><div id="yh" class="table">未実行</div></section>
<section class="card"><h2>11. Export</h2><div class="row"><button id="dSum" disabled>StabilitySummary.json</button><button id="dYear" disabled>YearStats.csv</button><button id="dPeriod" disabled>PeriodStats.csv</button><button id="dTrades" disabled>RuleTrades.csv</button></div></section><section class="card"><h2>Log</h2><div id="log" class="log">Ready.</div></section></main>
<script>"use strict";const $=x=>document.getElementById(x),PIP=.01;let S={rows:[],manifest:null,mining:null,trades:[],result:null,cancel:false};
function log(x){let e=$("log");e.textContent+=`\n[${new Date().toLocaleTimeString()}] ${x}`;e.scrollTop=e.scrollHeight}function st(x,p){$("status").textContent=x;$("bar").style.width=Math.max(0,Math.min(100,p))+"%"}function nap(){return new Promise(r=>setTimeout(r,0))}function split(line){let o=[],s="",q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===","&&!q){o.push(s);s=""}else s+=c}o.push(s);return o}function pat(s){return String(s).split("&").map(x=>x.trim()).filter(Boolean).map(x=>{let i=x.indexOf("=");return{feature:x.slice(0,i).trim(),value:x.slice(i+1).trim()}})}function match(r,p){for(const x of p)if(String(r[x.feature])!==String(x.value))return false;return true}function pf(x){return x.loss<0?x.win/Math.abs(x.loss):(x.win>0?999:0)}function dl(n,t,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:type+";charset=utf-8"}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function load(){let cf=$("core").files[0],sf=$("sum").files[0],mf=$("man").files[0];if(!cf||!sf||!mf)throw Error("3ファイルが必要です");S.mining=JSON.parse(await sf.text());S.manifest=JSON.parse(await mf.text());if(S.mining.best?.rule)$("rule").value=S.mining.best.rule;if(S.mining.direction)$("dir").value=S.mining.direction;if(S.mining.exit){$("tp").value=S.mining.exit.tp;$("sl").value=S.mining.exit.sl;$("hold").value=S.mining.exit.hold}let ls=(await cf.text()).split(/\r?\n/).filter(Boolean),h=split(ls[0]).map(x=>x.replace(/^\uFEFF/,"").trim());S.rows=[];for(let i=1;i<ls.length;i++){if(S.cancel)break;let a=split(ls[i]),r={};for(let j=0;j<h.length;j++)r[h[j]]=a[j];for(const k of ["Index","Open","High","Low","Close"])r[k]=+r[k];S.rows.push(r);if(i%100000===0){st(`Core読込 ${i.toLocaleString()}/${(ls.length-1).toLocaleString()}`,3+i/ls.length*22);await nap()}}$("info").textContent=`Rows ${S.rows.length.toLocaleString()} / ${S.mining.version}`}
function validate(){let m=S.manifest,c=S.rows[0]?Object.keys(S.rows[0]):[],e=[];if(m.stride!==1)e.push("stride!=1");if(m.simulatorSafe!==true)e.push("simulatorSafe!=true");if(m.validation?.status!=="FULL_CORE")e.push("FULL_COREではない");for(const x of ["DateTime","Open","High","Low","Close"])if(!c.includes(x))e.push("必須列なし:"+x);for(const x of pat($("rule").value))if(!c.includes(x.feature))e.push("Rule列なし:"+x.feature);let v=[["Rows",S.rows.length.toLocaleString()],["Manifest",m.version],["Stride",m.stride],["Safe",m.simulatorSafe?"TRUE":"FALSE"],["Status",m.validation?.status],["Validation",e.length?e.length+" ERROR":"PASS"]];$("val").innerHTML=v.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");if(e.length)throw Error(e.join(" / "))}
function sim(i,d,tp,sl,h){let en=S.rows[i].Close,sg=d==="LONG"?1:-1,t=en+sg*tp*PIP,s=en-sg*sl*PIP,ei=Math.min(S.rows.length-1,i+h),ex=S.rows[ei].Close,rs="HOLD";for(let j=i+1;j<=Math.min(S.rows.length-1,i+h);j++){let r=S.rows[j],ht=sg===1?r.High>=t:r.Low<=t,hs=sg===1?r.Low<=s:r.High>=s;if(ht&&hs){ei=j;ex=s;rs="BOTH_SL_FIRST";break}if(hs){ei=j;ex=s;rs="SL";break}if(ht){ei=j;ex=t;rs="TP";break}}return{entryIndex:i,exitIndex:ei,entryTime:S.rows[i].DateTime,exitTime:S.rows[ei].DateTime,entry:en,exit:ex,pips:(ex-en)/PIP*sg,reason:rs}}
async function build(){let p=pat($("rule").value),d=$("dir").value,tp=+$("tp").value,sl=+$("sl").value,h=+$("hold").value;S.trades=[];for(let i=0;i<S.rows.length-h-1;i++){if(S.cancel)break;if(match(S.rows[i],p))S.trades.push(sim(i,d,tp,sl,h));if(i%100000===0){st(`Rule評価 ${i.toLocaleString()}/${S.rows.length.toLocaleString()}`,28+i/S.rows.length*38);await nap()}}}
function sum(ts,l){let x={label:l,trades:0,win:0,loss:0,net:0,wins:0,maxDD:0,peak:0,equity:0};for(const t of ts){x.trades++;x.net+=t.pips;x.equity+=t.pips;x.peak=Math.max(x.peak,x.equity);x.maxDD=Math.max(x.maxDD,x.peak-x.equity);if(t.pips>0){x.win+=t.pips;x.wins++}else x.loss+=t.pips}x.pf=pf(x);x.avg=x.trades?x.net/x.trades:0;x.winRate=x.trades?x.wins/x.trades:0;x.recovery=x.maxDD?x.net/x.maxDD:(x.net>0?999:0);return x}function grp(fn){let m=new Map;for(const t of S.trades){let k=fn(new Date(t.entryTime));if(!m.has(k))m.set(k,[]);m.get(k).push(t)}return[...m.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([k,v])=>sum(v,k))}
function analyze(){let y=grp(d=>d.getUTCFullYear()),mo=grp(d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}`),w=grp(d=>["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]),h=grp(d=>String(d.getUTCHours()).padStart(2,"0")),yw=grp(d=>`${d.getUTCFullYear()}|${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()]}`),yh=grp(d=>`${d.getUTCFullYear()}|${String(d.getUTCHours()).padStart(2,"0")}`),mt=+$("minT").value,mp=+$("minPF").value,ma=+$("minAvg").value,vy=y.filter(x=>x.trades>=mt),vm=mo.filter(x=>x.trades>=mt),py=vy.filter(x=>x.pf>=mp&&x.avg>=ma).length,pm=vm.filter(x=>x.pf>=mp&&x.avg>=ma).length,yr=vy.length?py/vy.length:0,mr=vm.length?pm/vm.length:0,pfs=vy.map(x=>Math.min(5,x.pf)),mean=pfs.length?pfs.reduce((a,b)=>a+b,0)/pfs.length:0,sd=Math.sqrt(pfs.length?pfs.reduce((s,v)=>s+(v-mean)**2,0)/pfs.length:0),co=Math.max(0,1-sd/Math.max(1,mean)),sa=Math.min(1,Math.log10(S.trades.length+1)/4),score=Math.max(0,Math.min(100,yr*40+mr*25+co*20+sa*15));S.result={version:"ScalpLayer Origin Stability Engine v1.0",generatedAt:new Date().toISOString(),rule:$("rule").value,direction:$("dir").value,exit:{tp:+$("tp").value,sl:+$("sl").value,hold:+$("hold").value},overall:sum(S.trades,"Overall"),stability:{score,yearRate:yr,monthRate:mr,consistency:co,positiveYears:py,validYears:vy.length,positiveMonths:pm,validMonths:vm.length},yearStats:y,monthStats:mo,weekdayStats:w,hourStats:h,yearWeekdayStats:yw,yearHourStats:yh}}
function table(id,a){$(id).innerHTML=`<table><thead><tr><th>Period</th><th>Trades</th><th>PF</th><th>Avg</th><th>Net</th><th>Win%</th><th>MaxDD</th><th>Recovery</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.label}</td><td>${x.trades}</td><td>${x.pf.toFixed(3)}</td><td>${x.avg.toFixed(3)}</td><td>${x.net.toFixed(1)}</td><td>${(x.winRate*100).toFixed(1)}</td><td>${x.maxDD.toFixed(1)}</td><td>${x.recovery.toFixed(2)}</td></tr>`).join("")}</tbody></table>`}function render(){let r=S.result,g=r.stability.score>=90?"EA候補":r.stability.score>=70?"研究継続":"見送り",c=[["Score",r.stability.score.toFixed(1)],["判定",g],["Trades",r.overall.trades],["Overall PF",r.overall.pf.toFixed(3)],["Positive Years",`${r.stability.positiveYears}/${r.stability.validYears}`],["Positive Months",`${r.stability.positiveMonths}/${r.stability.validMonths}`]];$("score").innerHTML=c.map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("");table("years",r.yearStats);table("week",r.weekdayStats);table("hours",r.hourStats);table("yw",r.yearWeekdayStats);table("yh",r.yearHourStats);$("months").innerHTML=r.monthStats.map(x=>`<div class="cell"><span>${x.label}</span><b>${x.pf.toFixed(2)}</b><small>${x.trades} trades / ${x.avg.toFixed(2)} avg</small></div>`).join("")}
function csv(a){return["Period,Trades,PF,Avg,Net,WinRate,MaxDD,Recovery",...a.map(x=>[x.label,x.trades,x.pf,x.avg,x.net,x.winRate,x.maxDD,x.recovery].join(","))].join("\n")}function period(){let r=S.result;return["Type,Period,Trades,PF,Avg,Net,WinRate,MaxDD,Recovery",...["yearStats","monthStats","weekdayStats","hourStats","yearWeekdayStats","yearHourStats"].flatMap(k=>r[k].map(x=>[k,x.label,x.trades,x.pf,x.avg,x.net,x.winRate,x.maxDD,x.recovery].join(",")))].join("\n")}function tcsv(){return["EntryIndex,ExitIndex,EntryTime,ExitTime,Entry,Exit,Pips,Reason",...S.trades.map(x=>[x.entryIndex,x.exitIndex,x.entryTime,x.exitTime,x.entry,x.exit,x.pips,x.reason].join(","))].join("\n")}
$("run").onclick=async()=>{S.cancel=false;$("run").disabled=true;$("cancel").disabled=false;try{st("入力読込",2);await load();validate();st("Rule評価",28);await build();st("集計",70);analyze();render();for(const id of ["dSum","dYear","dPeriod","dTrades"])$(id).disabled=false;st("完了",100);log(`完了 Trades=${S.trades.length} Score=${S.result.stability.score.toFixed(1)}`)}catch(e){st("エラー: "+e.message,0);log("ERROR "+(e.stack||e.message))}finally{$("run").disabled=false;$("cancel").disabled=true}};$("cancel").onclick=()=>S.cancel=true;$("dSum").onclick=()=>dl("ScalpLayer_Origin_StabilitySummary_v1_0.json",JSON.stringify(S.result,null,2),"application/json");$("dYear").onclick=()=>dl("ScalpLayer_Origin_YearStats_v1_0.csv",csv(S.result.yearStats),"text/csv");$("dPeriod").onclick=()=>dl("ScalpLayer_Origin_PeriodStats_v1_0.csv",period(),"text/csv");$("dTrades").onclick=()=>dl("ScalpLayer_Origin_StabilityRuleTrades_v1_0.csv",tcsv(),"text/csv");</script></body></html>
